<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Browser</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app">
  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="newtab" title="New tab (Ctrl+T)">+</button>
  </div>

  <div id="toolbar">
    <button class="nav" id="back" title="Back (Alt+Left)">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <button class="nav" id="fwd" title="Forward (Alt+Right)">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
    </button>
    <button class="nav" id="reload" title="Reload this page only (Ctrl+R)">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6" /></svg>
    </button>

    <form id="omni">
      <span id="sitename" class="hidden"><span id="sitename-text"></span></span>
      <input id="url" type="text" placeholder="Search or enter address" spellcheck="false" autocomplete="off" />
      <button id="go" type="submit" title="Go">↵</button>
    </form>
  </div>

  <div id="progress"><div id="progress-bar"></div></div>

  <div id="stage">
    <div id="frames"></div>

    <div id="startpage">
      <div class="sp-inner">
        <h1>Where to?</h1>
        <form id="sp-form">
          <input id="sp-input" placeholder="Search the web or type a URL" spellcheck="false" autocomplete="off" />
        </form>
        <div class="sp-links">
          <button data-url="https://en.wikipedia.org">Wikipedia</button>
          <button data-url="https://duckduckgo.com">DuckDuckGo</button>
          <button data-url="https://news.ycombinator.com">Hacker News</button>
          <button data-url="https://www.reddit.com">Reddit</button>
          <button data-url="https://github.com">GitHub</button>
        </div>
        <p class="sp-note">This browser runs inside the page. Reloading only reloads the site you're viewing.</p>
      </div>
    </div>
  </div>
</div>

<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
